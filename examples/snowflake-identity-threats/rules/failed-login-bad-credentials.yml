title: Snowflake Failed Login - Bad Credentials
id: 1c9a7f3e-5b21-4d0e-8a4f-0e1d2c3b4a02
status: stable
description: >-
  Detect failed Snowflake logins caused by incorrect username/password, the
  raw signal behind brute-force and credential-stuffing attempts against the
  account.
logsource:
  product: snowflake
  service: login_history
detection:
  selection:
    IS_SUCCESS: 'NO'
    ERROR_MESSAGE|contains: 'INCORRECT_USERNAME_PASSWORD'
  condition: selection
falsepositives:
  - Users mistyping passwords; alert on volume per CLIENT_IP downstream
level: medium
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.004
x-dps-investigation:
  - Group failures by CLIENT_IP and USER_NAME to spot spraying patterns
  - Check for a subsequent successful login from the same IP
  - Block offending IPs via a Snowflake network policy
  - Reset credentials for targeted accounts
