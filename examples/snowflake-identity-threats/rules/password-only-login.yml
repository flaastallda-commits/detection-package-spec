title: Snowflake Password-Only Login (No MFA)
id: 1c9a7f3e-5b21-4d0e-8a4f-0e1d2c3b4a01
status: stable
description: >-
  Detect successful Snowflake logins authenticated with a password and no
  second factor. Password-only access to a data warehouse is the primary
  precursor to credential-stuffing and session-hijack compromises (see the
  2024 Snowflake customer-account campaign).
logsource:
  product: snowflake
  service: login_history
detection:
  selection:
    IS_SUCCESS: 'YES'
    FIRST_AUTHENTICATION_FACTOR: 'PASSWORD'
  condition: selection
falsepositives:
  - Service accounts using key-pair auth are excluded by factor; legacy service accounts on passwords should be migrated
level: high
tags:
  - attack.credential_access
  - attack.initial_access
  - attack.t1078.004
  - attack.t1556.006
x-dps-investigation:
  - Identify the user and CLIENT_IP of the login
  - Check whether the account is human or service — enforce MFA / key-pair accordingly
  - Review QUERY_HISTORY for the session for unusual activity
  - Enable an account-level authentication policy requiring MFA
